name: CI

on:
  pull_request:
  push:
    branches: [main, feat/harden-workflow-production]

permissions:
  contents: read

jobs:
  node-quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:node
        env:
          FEATURE_FLAG_STRICT_MODE: "false"
          NVIDIA_API_KEY: PENDING_CONFIGURATION

  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check --select E9,F,I plx-documentos/ingress-queue plx-documentos/operations-panel
      - run: python -m unittest -v test_queue_service.py
        working-directory: plx-documentos/ingress-queue
      - run: python -m unittest -v test_panel.py
        working-directory: plx-documentos/operations-panel

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --no-cache -t plx-document-reader:test plx-documentos/document-reader
